
<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="o0kPbDssaA0qHPNRLRFm1x0QNGvInYrUKEsOQMjsCd0" />
  <title>4K & Free Fire Wallpaper App</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0d1117;
      color: #fff;
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(-30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes inputPulse {
      0% { box-shadow: 0 0 0px #ff4500; }
      50% { box-shadow: 0 0 10px #ff4500; }
      100% { box-shadow: 0 0 0px #ff4500; }
    }

    @keyframes cardPop {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Page 1: Login & Ad Section */
    #loginPage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      animation: fadeIn 1.2s ease-in-out;
    }

    .login-card {
      background: #161b22;
      border: 1px solid #333;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      color: #ffcc00;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      font-size: 13px;
      color: #ccc;
      display: block;
      margin-bottom: 5px;
    }

    /* Animated Input Fields */
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      background: #0d1117;
      color: #fff;
      border-radius: 8px;
      outline: none;
      transition: all 0.4s ease;
    }

    input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus {
      border-color: #ff4500;
      animation: inputPulse 1.5s infinite;
      transform: translateY(-2px);
    }

    .show-pass {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(45deg, #ff4500, #ffcc00);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
      transition: 0.3s;
    }

    .btn-login:hover {
      transform: scale(1.03);
    }

    /* Ad Banner on Page 1 */
    .ad-banner {
      width: 100%;
      max-width: 380px;
      margin-top: 20px;
      padding: 15px;
      border: 2px dashed #ffcc00;
      border-radius: 10px;
      background: rgba(255, 204, 0, 0.05);
      text-align: center;
      color: #ffcc00;
      font-size: 14px;
      font-weight: bold;
    }

    /* Page 2: Wallpaper Gallery Section */
    #galleryPage {
      display: none;
      padding: 20px 10px;
      max-width: 1100px;
      margin: 0 auto;
      animation: fadeIn 1s ease-in-out;
    }

    .header {
      text-align: center;
      padding: 15px;
      background: linear-gradient(180deg, #ff4500, #0d1117);
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .ff-logo {
      width: 130px;
      filter: drop-shadow(0 0 8px #ff4500);
    }

    .header h1 {
      color: #ffcc00;
      font-size: 22px;
      margin: 5px 0 0;
      text-transform: uppercase;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .card {
      background: #161b22;
      border: 1px solid #222;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 10px;
      animation: cardPop 0.5s ease-in-out;
    }

    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
    }

    .card p {
      margin: 8px 0;
      font-size: 12px;
      font-weight: bold;
      color: #ffcc00;
    }

    .btn-download {
      padding: 6px 14px;
      background: #ff4500;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }
  </style>

        <input type="password" id="pass" placeholder="ፓስወርድ ያስገቡ">
        <div class="show-pass">
          <input type="checkbox" onclick="togglePassword()"> Show Password
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="ኢሜይል ያስገቡ">
      </div>

      <button class="btn-login" onclick="login()">Log In</button>
    </div>

    <!-- Ad Space on Entrance Page -->
    <div class="ad-banner">
      📢 ማስታወቂያ፡ በቅርቡ የ Free Fire Diamond ሽልማቶች ይኖረናል!
    </div>
  </div>

      <h1>WALLPAPER GALLERY</h1>
    </div>

    <div style="text-align: right; margin-bottom: 15px;">
      <button onclick="logout()" style="background: #e74c3c; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">ውጣ (Logout)</button>
    </div>

    <div class="gallery-grid" id="wallpaperContainer">
      <!-- 60 Images dynamically generated by JS -->
    </div>
  </div>

      const passInput = document.getElementById("pass");
      passInput.type = (passInput.type === "password") ? "text" : "password";

    function login() {
      const fname = document.getElementById("fname").value;
      const pass = document.getElementById("pass").value;
      const email = document.getElementById("email").value;

      if(fname !== "" && pass !== "" && email !== "") {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("galleryPage").style.display = "block";
      } else {
        alert("እባክዎን ሁሉንም መስኮች ይሙሉ!");
      }
    }

    // Load Wallpapers into HTML Container
    const container = document.getElementById("wallpaperContainer");
    wallpapers.forEach((wp, index) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${wp.url}" alt="${wp.name}">
        <p>${wp.name}</p>
        <button class="btn-download" onclick="downloadImage('${wp.url}', 'wallpaper-${index+1}.jpg')">Download</button>
      `;
      container.appendChild(card);
    });

    // Mobile Safe Blob Download
    async function downloadImage(imageSrc, fileName) {
      try {
        const response = await fetch(imageSrc);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        alert("ምስሉ እየወረደ ነው!");
      } catch (error) {
        window.location.href = imageSrc;
      }
    }
