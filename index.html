<!DOCTYPE html>
<html>
<head>
  <meta name="google-site-verification" content="o0kPbDssaA0qHPNRL..." />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Wallpaper App</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #e8f8f5;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardPop {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    #loginPage {
      text-align: center;
      padding-top: 50px;
      animation: fadeIn 1.2s ease-in-out;
    }

    h1 {
      color: green;
      animation: fadeIn 1.5s ease-in-out;
    }

    .form-group {
      margin-bottom: 15px;
      animation: fadeIn 1.5s ease-in-out;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      padding: 10px;
      width: 80%;
      max-width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
      transition: transform 0.3s, border-color 0.3s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus {
      border-color: #2c3e50;
      transform: scale(1.05);
    }

    button.login-btn {
      background-color: green;
      color: white;
      padding: 10px 25px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button.login-btn:active { transform: scale(0.95); }

    #galleryPage {
      display: none;
      padding: 15px;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      color: white;
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: cardPop 0.8s ease-out;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .download-btn {
      display: block;
      margin-top: 8px;
      padding: 8px 0;
      background: linear-gradient(45deg, #11998e, #38ef7d);
      color: white;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      width: 100%;
      cursor: pointer;
    }

    .logout-btn {
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px 16px;
      font-size: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body onload="loadSavedData()">

  <!-- LOGIN PAGE -->
  <div id="loginPage">
    <h1>እንኳን ደህና መጡ!</h1>

    <div class="form-group">
      First Name <br>
      <input type="text" id="fname" placeholder="ስምዎን ያስገቡ">
    </div>

    <div class="form-group">
      Password <br>
      <input type="password" id="pass" placeholder="ፓስዎርድ ያስገቡ"><br>
      <input type="checkbox" onclick="togglePassword()"> Show Password
    </div>

    <div class="form-group">
      Email <br>
      <input type="email" id="email" placeholder="ኢሜይል ያስገቡ">
    </div>

    <button type="button" class="login-btn" onclick="login()">Log In</button>
  </div>

  <!-- GALLERY PAGE -->
  <div id="galleryPage">
    <button class="logout-btn" onclick="logout()">Log Out</button>
    <h2>✨ 4K HD Wallpapers ✨</h2>

    <div class="gallery">
      <div class="card"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1000', 'wallpaper1.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000', 'wallpaper2.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1000', 'wallpaper3.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000', 'wallpaper4.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1000', 'wallpaper5.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1000', 'wallpaper6.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1000', 'wallpaper7.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=1000', 'wallpaper8.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000', 'wallpaper9.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000', 'wallpaper10.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1439853949127-fa647821eba0?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1439853949127-fa647821eba0?q=80&w=1000', 'wallpaper11.jpg')">📥 Download</button></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1000"><button class="download-btn" onclick="downloadImage('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1000', 'wallpaper12.jpg')">📥 Download</button></div>
    </div>
  </div>

  <script>
    function loadSavedData() {
      let savedName = localStorage.getItem("registeredName");
      let savedEmail = localStorage.getItem("registeredEmail");

      if (savedName) document.getElementById("fname").value = savedName;
      if (savedEmail) document.getElementById("email").value = savedEmail;
    }

    function login() {
      let firstName = document.getElementById("fname").value.trim();
      let password = document.getElementById("pass").value.trim();
      let email = document.getElementById("email").value.trim();

      if (firstName === "" || password === "" || email === "") {
        alert("እባክዎን ሁሉንም መረጃዎች ያሙሉ!");
        return;
      }

      let registeredEmail = localStorage.getItem("registeredEmail");
      let registeredPass = localStorage.getItem("registeredPass");

      if (!registeredEmail) {
        localStorage.setItem("registeredName", firstName);
        localStorage.setItem("registeredEmail", email);
        localStorage.setItem("registeredPass", password);
        
        alert("በተሳካ ሁኔታ ተመዝግበዋል!");
        showGallery();
      } else {
        if (email === registeredEmail && password === registeredPass) {
          showGallery();
        } else {
          alert("የተሳሳተ ኢሜይል ወይም ፓስዎርድ!");
        }
      }
    }

    function showGallery() {
      document.getElementById("loginPage").style.display = "none";
      let gallery = document.getElementById("galleryPage");
      gallery.style.display = "block";
      gallery.style.animation = "fadeIn 1s ease-in-out";
    }

    function logout() {
      document.getElementById("pass").value = "";
      document.getElementById("galleryPage").style.display = "none";
      document.getElementById("loginPage").style.display = "block";
    }

    function togglePassword() {
      let passInput = document.getElementById("pass");
      passInput.type = (passInput.type === "password") ? "text" : "password";
    }

    // የላቀ Download ማድረጊያ JavaScript function
    async function downloadImage(imageSrc, fileName) {
      try {
        const response = await fetch(imageSrc);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        alert("ምስሉ እየወረደ ነው!");
      } catch (error) {
        // TrebEdit fetch ከከለከለው ወደ ምስሉ በቀጥታ ይመረዋል
        window.location.href = imageSrc;
      }
    }
  </script>

</body>
</html>
